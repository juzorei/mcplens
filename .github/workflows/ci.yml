name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml ./tools/mcplens
      - run: python scripts/validate_skills.py
      - run: python -m pytest -q
      - run: mcplens --version
      - run: mcplens demo mcplens-demo
      # the demo trace has planted warns: exit code 1 and all three findings are the expected outcome
      - run: mcplens analyze mcplens-demo/looping-session.ndjson > analyze.out || python -c "open('warned','w').write('1')"
      - run: python -c "import sys; out = open('analyze.out').read(); missing = [k for k in ('repeated-calls', 'ping-pong', 'unanswered') if k not in out]; warned = __import__('pathlib').Path('warned').exists(); sys.exit(0 if (warned and not missing) else 1)"
